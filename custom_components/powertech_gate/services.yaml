capture_system_status:
  name: Capture system status
  description: >-
    Read-only PS19001 diagnostic sampling. Sends READ STATUS (UART 1) or RS at most once every two seconds,
    stops on an unanswered request, and never sends movement commands.
    Enable feedback capture first; download diagnostics after the test.
  fields:
    protocol:
      name: Status protocol
      description: Auto follows reported UART version. RS is a one-request compatibility check and requires duration 1.
      default: auto
      selector:
        select:
          options:
            - auto
            - rs
    include_shadow:
      name: Include raw status snapshots
      description: Also request the AWS shadow each sample. Stored data may be stale; compare version and timestamps in diagnostics.
      default: false
      selector:
        boolean:
    config_entry_id:
      name: Integration entry
      description: The loaded Powertech integration to sample.
      required: true
      selector:
        config_entry:
          integration: powertech_gate
    duration:
      name: Sampling duration
      description: Seconds, up to 90. Use 0 to cancel a running capture.
      default: 60
      selector:
        number:
          min: 0
          max: 90
          step: 1
          unit_of_measurement: s
